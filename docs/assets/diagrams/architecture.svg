<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="660" viewBox="0 0 1040 660" role="img" aria-label="Nighthawks architecture">
<title>Nighthawks architecture</title>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
  <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#be123c"/></marker>
</defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<g font-family="Segoe UI, Helvetica, Arial, sans-serif" fill="#0f172a">
<text x="20" y="30" text-anchor="start" font-size="17" font-weight="700" fill="#0f172a">Nighthawks PS-021 — architecture (one Node.js process, one SQLite file)</text>
<rect x="20" y="60" width="230" height="86" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.6"/>
<text x="135" y="91" text-anchor="middle" font-size="15" font-weight="700" fill="#0369a1">React dashboard</text>
<text x="135" y="108" text-anchor="middle" font-size="12.5" fill="#334155">useBackendEngine (polls)</text>
<text x="135" y="125" text-anchor="middle" font-size="12.5" fill="#334155">ManualControls · Vite proxy</text>
<rect x="310" y="60" width="210" height="86" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.6"/>
<text x="415" y="91" text-anchor="middle" font-size="15" font-weight="700" fill="#6d28d9">HTTP API (Express)</text>
<text x="415" y="108" text-anchor="middle" font-size="12.5" fill="#334155">createApp · /api/*</text>
<text x="415" y="125" text-anchor="middle" font-size="12.5" fill="#334155">dialogs · scenarios · restart</text>
<rect x="580" y="60" width="440" height="86" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="1.6"/>
<text x="800" y="91" text-anchor="middle" font-size="15" font-weight="700" fill="#334155">SimulationRuntime</text>
<text x="800" y="108" text-anchor="middle" font-size="12.5" fill="#334155">one lock · event log · scenario runner</text>
<text x="800" y="125" text-anchor="middle" font-size="12.5" fill="#334155">restart = rebuild everything from the file</text>
<line x1="250" y1="103" x2="310" y2="103" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="280" y="96" text-anchor="middle" font-size="12" fill="#334155">REST</text>
<line x1="520" y1="103" x2="580" y2="103" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="20" y="220" width="260" height="96" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.6"/>
<text x="150" y="256" text-anchor="middle" font-size="15" font-weight="700" fill="#1d4ed8">Adapter A (initiator)</text>
<text x="150" y="273" text-anchor="middle" font-size="12.5" fill="#334155">startDialog · sendRequest · retryRequest</text>
<text x="150" y="290" text-anchor="middle" font-size="12.5" fill="#334155">recover · completeDialog · failDialog</text>
<rect x="370" y="220" width="270" height="96" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/>
<text x="505" y="256" text-anchor="middle" font-size="15" font-weight="700" fill="#b45309">Transport (in-process)</text>
<text x="505" y="273" text-anchor="middle" font-size="12.5" fill="#334155">ObservedTransport extends Transport</text>
<text x="505" y="290" text-anchor="middle" font-size="12.5" fill="#334155">fault: drop request / drop reply</text>
<rect x="730" y="220" width="290" height="96" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.6"/>
<text x="875" y="256" text-anchor="middle" font-size="15" font-weight="700" fill="#6d28d9">Adapter B (receiver)</text>
<text x="875" y="273" text-anchor="middle" font-size="12.5" fill="#334155">handleRequest: correlate → dedup →</text>
<text x="875" y="290" text-anchor="middle" font-size="12.5" fill="#334155">terminal check → work → record</text>
<line x1="860" y1="146" x2="860" y2="220" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="868" y="176" text-anchor="start" font-size="12" fill="#334155">builds &amp; drives both adapters</text>
<line x1="640" y1="146" x2="230" y2="220" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="280" y1="252" x2="370" y2="252" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="325" y="244" text-anchor="middle" font-size="12" fill="#334155">request</text>
<line x1="370" y1="290" x2="280" y2="290" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="325" y="307" text-anchor="middle" font-size="12" fill="#334155">response</text>
<text x="505" y="334" text-anchor="middle" font-size="11" font-weight="400" fill="#475569">request = (dialog_id, task_id, seq, payload) · response = ok | duplicate | error</text>
<line x1="640" y1="252" x2="730" y2="252" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="685" y="245" text-anchor="middle" font-size="12" fill="#334155">deliver</text>
<line x1="730" y1="290" x2="640" y2="290" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="685" y="307" text-anchor="middle" font-size="12" fill="#334155">answer</text>
<rect x="735" y="360" width="200" height="54" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.6"/>
<text x="835" y="383.5" text-anchor="middle" font-size="13" font-weight="700" fill="#6d28d9">Mock side effect</text>
<text x="835" y="400.5" text-anchor="middle" font-size="12.5" fill="#334155">InMemorySideEffectTracker</text>
<line x1="835" y1="316" x2="835" y2="360" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="330" y="380" width="330" height="70" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/>
<text x="495" y="411.5" text-anchor="middle" font-size="15" font-weight="700" fill="#15803d">DialogManager</text>
<text x="495" y="428.5" text-anchor="middle" font-size="12.5" fill="#334155">correlate · lifecycle transitions · task identity</text>
<line x1="150" y1="316" x2="360" y2="380" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="225" y="341" text-anchor="middle" font-size="12" fill="#334155">state</text>
<line x1="760" y1="316" x2="640" y2="380" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="638" y="364" text-anchor="middle" font-size="12" fill="#334155">correlate / transition</text>
<rect x="20" y="500" width="300" height="64" rx="10" fill="#ecfeff" stroke="#0e7490" stroke-width="1.6"/>
<text x="170" y="528.5" text-anchor="middle" font-size="14" font-weight="700" fill="#0e7490">OutboundRequestRepository</text>
<text x="170" y="545.5" text-anchor="middle" font-size="12.5" fill="#334155">outbound_requests — Adapter A send log</text>
<rect x="360" y="500" width="270" height="64" rx="10" fill="#ecfeff" stroke="#0e7490" stroke-width="1.6"/>
<text x="495" y="528.5" text-anchor="middle" font-size="14" font-weight="700" fill="#0e7490">DialogRepository</text>
<text x="495" y="545.5" text-anchor="middle" font-size="12.5" fill="#334155">dialogs — identity + state</text>
<rect x="670" y="500" width="350" height="64" rx="10" fill="#ecfeff" stroke="#0e7490" stroke-width="1.6"/>
<text x="845" y="528.5" text-anchor="middle" font-size="14" font-weight="700" fill="#0e7490">RequestRepository</text>
<text x="845" y="545.5" text-anchor="middle" font-size="12.5" fill="#334155">requests — Adapter B processed records (dedup)</text>
<line x1="100" y1="316" x2="100" y2="500" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="108" y="401" text-anchor="start" font-size="12" fill="#334155">send log</text>
<line x1="495" y1="450" x2="495" y2="500" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="985" y1="316" x2="985" y2="500" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="979" y="458" text-anchor="end" font-size="12" fill="#334155">dedup ledger</text>
<rect x="330" y="596" width="380" height="54" rx="10" fill="#cffafe" stroke="#0e7490" stroke-width="1.6"/>
<text x="520" y="619.5" text-anchor="middle" font-size="14" font-weight="700" fill="#0e7490">SQLite file (sql.js)</text>
<text x="520" y="636.5" text-anchor="middle" font-size="12.5" fill="#334155">persistToDisk() after every write</text>
<line x1="170" y1="564" x2="380" y2="596" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="495" y1="564" x2="495" y2="596" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="845" y1="564" x2="660" y2="596" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>
</g>
</svg>
